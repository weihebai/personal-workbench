services:
  workbench:
    build: .
    image: personal-workbench:latest
    container_name: workbench
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      ADDR: ":8080"
      DB_PATH: /app/data/workbench.db
      STATIC_DIR: /app/web
      # 生产环境务必修改
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      JWT_SECRET: ${JWT_SECRET:-}
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-168}
    volumes:
      # 数据全部落在宿主机，容器无状态：删容器/换镜像都不丢数据。
      # 默认 ./data（相对 compose 文件所在目录），生产建议在 .env 里设绝对路径：
      #   DATA_DIR=/opt/workbench/data
      - ${DATA_DIR:-./data}:/app/data
    # 不暴露到公网：由 cloudflared 通过内部网络访问
    expose:
      - "8080"
    networks:
      - wb

  # Cloudflare Tunnel：主动外连，源站无需开放任何入站端口
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: workbench-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - workbench
    networks:
      - wb

networks:
  wb:
    driver: bridge
